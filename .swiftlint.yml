# SwiftLint configuration for Wordbank
# Thresholds and disabled rules kept in sync with the AIChat project.

included:
  - Wordbank
  - WordbankTests
  - WordbankUITests

excluded:
  - .git
  - .build
  - DerivedData
  - Pods
  - Carthage

disabled_rules:
  # 900+ hits across AIChat — this matches the editor's actual behavior.
  - trailing_whitespace

# --- Thresholds: same values as AIChat ---
line_length:
  warning: 300
  ignores_urls: true
  ignores_comments: true

type_body_length:
  warning: 500

file_length:
  warning: 750

# --- Additions beyond AIChat ---
# Safety rules only. Formatting opt-ins that fought AIChat's style
# (operator_usage_whitespace, closure_spacing, closure_end_indentation,
# multiline_arguments) are deliberately left off.
opt_in_rules:
  - array_init
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - yoda_condition

identifier_name:
  min_length: 2
  excluded: [id, x, y, z, to, up]

reporter: "xcode"
